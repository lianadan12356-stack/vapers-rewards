<style>
:root{--bg:#07131e;--panel:#102130;--panel2:#132b3b;--line:#284659;--text:#edf7fa;--muted:#91a9b8;--mint:#57f0d0;--blue:#48baff;--amber:#ffe0a3;--danger:#ffb4b4;--r:21px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 86% -10%,#17364a 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1040px;margin:auto;padding:22px 20px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,var(--mint),var(--blue));display:grid;place-items:center;color:#06202b;font-weight:950;letter-spacing:1px}.brand b{display:block;font-size:17px;letter-spacing:2px}.brand small{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:750}.status{font-size:12px;color:var(--muted)}main{max-width:820px;margin:auto}.eyebrow{font-size:11px;color:var(--mint);font-weight:850;letter-spacing:3px;text-transform:uppercase}.title{font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-1.3px;margin:8px 0}.sub{color:var(--muted);margin:0 0 24px}.panel{background:linear-gradient(145deg,rgba(17,38,54,.98),rgba(10,24,36,.98));border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:0 18px 54px #0003;animation:rise .4s ease both}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.member{font-size:21px;font-weight:780}.membercode,.hint{font-size:12px;color:var(--muted)}.pill{border:1px solid #2d5b62;background:#113337;color:#88ffdf;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:850;letter-spacing:1px;white-space:nowrap}.pill.ready{border-color:#71603d;background:#352d1b;color:var(--amber)}.progresshead{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px;font-weight:750}.progresshead b{font-size:24px;color:var(--mint)}.progress{height:8px;border-radius:9px;background:#203543;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:9px;transition:width .75s cubic-bezier(.2,.8,.2,1)}.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:17px}.stamp{aspect-ratio:1;border:1px solid #36556b;background:#102333;border-radius:13px;display:grid;place-items:center;color:#829aaa;font-size:13px;font-weight:850}.stamp.done{border-color:#51dbc8;color:#061e28;background:linear-gradient(140deg,#73ffda,#58bfff);animation:stampIn .48s cubic-bezier(.18,.89,.32,1.28) both;animation-delay:calc(var(--i,0)*35ms)}.reward{display:flex;gap:13px;align-items:center;padding:16px;margin-top:18px;border:1px solid #267f89;background:linear-gradient(90deg,#102e3d,#112639);border-radius:15px;position:relative;overflow:hidden}.reward.ready{animation:rewardPulse 2.6s ease-in-out infinite}.rewardIcon{width:42px;height:42px;border-radius:13px;background:#183b49;display:grid;place-items:center;color:var(--mint);font-size:22px}.reward.ready .rewardIcon{animation:starIn .58s cubic-bezier(.2,.8,.2,1)}.reward b{display:block}.reward small{color:var(--muted)}.qrbox{display:grid;justify-items:center;text-align:center}.qr{min-width:220px;min-height:220px;background:white;padding:10px;border-radius:15px;display:grid;place-items:center;margin:4px 0 12px}.qr img,.qr canvas{max-width:100%;height:auto!important}.btn{border:0;border-radius:12px;background:linear-gradient(135deg,var(--mint),var(--blue));color:#041923;padding:12px 15px;font:inherit;font-weight:850;cursor:pointer;transition:transform .18s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 9px 24px #34c5e033}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}.btn.secondary{background:#1b3547;color:var(--text);border:1px solid #36566a}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.actions{display:flex;flex-wrap:wrap;gap:9px}.actions .btn{flex:1}.field{width:100%;border:1px solid var(--line);background:#091722;color:var(--text);border-radius:11px;padding:12px 13px;font:inherit;outline:none}.field:focus{border-color:var(--mint);box-shadow:0 0 0 3px #57f0d01a}.stack{display:grid;gap:10px}.rowline{display:flex;gap:9px}.rowline .field{min-width:0;flex:1}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0c1b27;border:1px solid #203746;border-radius:13px;padding:13px}.itemname{font-weight:750}.right{display:flex;align-items:center;gap:8px}.mini{font-size:11px;color:var(--muted);margin-top:3px}.scanner{border:1px dashed #42677c;background:#091722;border-radius:15px;min-height:90px;padding:10px;overflow:hidden}.error{color:var(--danger);font-size:13px}.success{color:var(--mint);font-size:13px}.notice{border:1px solid #66572f;background:#2b2412;color:#efd99d;border-radius:12px;padding:11px 13px;font-size:12px;margin-bottom:18px}.hidden{display:none!important}.qrurl{width:100%;overflow-wrap:anywhere;background:#091722;border:1px solid #203746;border-radius:10px;padding:10px;color:#bce5ee;font:11px ui-monospace,monospace;margin:10px 0}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#d9fff4;color:#06251d;padding:11px 16px;border-radius:999px;font-weight:780;box-shadow:0 8px 30px #0007;z-index:10}.muted{color:var(--muted)}.rule{height:1px;background:#294355;border:0;margin:18px 0}.foot{color:#70899a;font-size:11px;margin-top:20px;text-align:center}.foot .credit{display:inline-flex;align-items:center;gap:7px;margin-left:9px;padding:5px 10px;border:1px solid #28536b;border-radius:999px;background:#0c1d2b;color:#bfefff;font-size:9px;font-weight:850;letter-spacing:1.4px}.foot .credit i{font-style:normal;color:#70f3df;animation:makerGlow 2.5s ease-in-out infinite}@keyframes makerGlow{0%,100%{opacity:.55;text-shadow:0 0 0 #6deaff}50%{opacity:1;text-shadow:0 0 12px #6deaff}}
.logo svg{width:34px;height:34px;overflow:visible}.vape-device{fill:#10293a;stroke:#e8fcff;stroke-width:1.8}.vape-mouth{fill:#56dfff;stroke:#e8fcff;stroke-width:1}.vape-glint{stroke:#69f4dc;stroke-width:2;stroke-linecap:round}.vape-smoke{fill:none;stroke:#d6fbff;stroke-width:2.6;stroke-linecap:round;animation:vaporRise 2.1s ease-in-out infinite;transform-origin:center}.smoke-b{animation-delay:.75s;opacity:.8}@keyframes vaporRise{0%{opacity:0;transform:translateY(5px) scale(.8)}35%{opacity:1}100%{opacity:0;transform:translateY(-7px) scale(1.15)}}
.edit-dialog{width:min(430px,calc(100vw - 28px));border:1px solid #36566a;border-radius:20px;background:#102130;color:var(--text);padding:22px;box-shadow:0 30px 90px #0009}.edit-dialog::backdrop{background:#020912bb;backdrop-filter:blur(5px)}.edit-dialog h2{margin:0 0 8px}.edit-dialog .actions{margin-top:14px}.member-toolbar{display:grid;gap:9px;margin:12px 0}.member-summary{font-size:12px;color:var(--muted)}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.row-actions .btn{padding:8px 10px;font-size:12px}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes stampIn{0%{opacity:.3;transform:scale(.72) rotate(-8deg)}70%{opacity:1;transform:scale(1.13) rotate(2deg)}100%{transform:scale(1)}}@keyframes rewardPulse{0%,100%{box-shadow:0 0 0 #57f0d000}50%{box-shadow:0 0 26px #57f0d028}}@keyframes starIn{0%{transform:rotate(-30deg) scale(.65)}70%{transform:rotate(12deg) scale(1.17)}100%{transform:rotate(0) scale(1)}}

.loyalty-card{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px;align-items:center;min-height:190px;padding:17px;border:1px solid #39789a;border-radius:18px;overflow:hidden;background:linear-gradient(125deg,#07121e 0%,#102943 65%,#11182d 100%);box-shadow:inset 0 1px #9beeff22,0 13px 30px #0005;color:#f4fbff}.loyalty-card:before{content:"";position:absolute;z-index:-2;inset:-40%;background:radial-gradient(ellipse at 75% 35%,#238cff55,transparent 42%),radial-gradient(ellipse at 15% 90%,#3fe9d733,transparent 35%);animation:cardGlow 6s ease-in-out infinite alternate}.loyalty-card:after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(115deg,transparent 30%,#a9f4ff0b 50%,transparent 68%);background-size:200% 100%;animation:cardSheen 7s ease-in-out infinite}.loyalty-info{min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between}.loyalty-brand{font-size:12px;font-weight:950;letter-spacing:2.5px}.loyalty-tag{font-size:8px;letter-spacing:2px;color:#91b2c4;font-weight:750;margin-top:2px}.loyalty-name{font-size:clamp(15px,3vw,20px);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:12px}.loyalty-id{font-size:10px;color:#9db8c7;font-family:ui-monospace,monospace;margin-top:2px}.loyalty-stamps{display:grid;grid-template-columns:repeat(5,17px);gap:5px;margin:10px 0}.loyalty-stamps i{width:17px;height:17px;border-radius:50%;border:1px solid #57cefa;background:#10283c;display:grid;place-items:center;font-style:normal;font-size:9px;color:#dffaff;font-weight:900}.loyalty-stamps i.done{background:linear-gradient(135deg,#65f3d2,#4abaff);color:#062332;border-color:#a7fff2}.loyalty-offer{font-size:10px;font-weight:950;letter-spacing:.8px;color:#74e9fa}.loyalty-credit{font-size:7px;color:#76dff8;font-weight:850;letter-spacing:1.2px;margin-top:6px;text-shadow:0 0 12px #51dfff55}.loyalty-qr-panel{position:relative;display:grid;justify-items:center;gap:5px;background:#fff;color:#123;border-radius:12px;padding:7px;width:104px}.loyalty-qr{width:88px;height:88px;display:grid;place-items:center;background:#fff}.loyalty-qr img,.loyalty-qr canvas{width:88px!important;height:88px!important}.loyalty-qr-label{font-size:7px;letter-spacing:1px;font-weight:900;color:#456}
@keyframes cardGlow{from{transform:translateX(-8px) scale(.96);opacity:.7}to{transform:translateX(8px) scale(1.06);opacity:1}}@keyframes cardSheen{0%,55%{background-position:120% 0}100%{background-position:-120% 0}}
@media(max-width:650px){.loyalty-card{grid-template-columns:minmax(0,1fr) 84px;gap:8px;min-height:158px;padding:12px;border-radius:15px}.loyalty-qr-panel{width:84px;padding:6px;border-radius:10px}.loyalty-qr,.loyalty-qr img,.loyalty-qr canvas{width:70px!important;height:70px!important}.loyalty-stamps{grid-template-columns:repeat(5,14px);gap:4px}.loyalty-stamps i{width:14px;height:14px;font-size:8px}.loyalty-brand{font-size:10px}.loyalty-tag{font-size:7px}.loyalty-name{font-size:15px;margin-top:8px}.loyalty-offer{font-size:9px}}

@media(max-width:650px){.wrap{padding:16px 13px 35px}.grid{grid-template-columns:1fr}.top{margin-bottom:23px}.panel{padding:17px}.item{align-items:flex-start}.right{flex-direction:column;align-items:stretch}.right .btn{padding:9px 10px}.qr{min-width:210px;min-height:210px}.actions .btn{flex-basis:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

<body><div class="wrap">
<header class="top"><div class="brand"><div class="logo"><svg viewBox="0 0 48 48" role="img" aria-label="Vape with rising vapor"><path class="vape-smoke smoke-a" d="M25 14c-8-5 3-7-2-12"/><path class="vape-smoke smoke-b" d="M31 15c7-5-2-7 3-12"/><rect class="vape-device" x="17" y="17" width="15" height="25" rx="5"/><rect class="vape-mouth" x="21" y="12" width="7" height="7" rx="2"/><path class="vape-glint" d="M21 23v13"/></svg></div><div><b>VAPERS</b><small>REWARDS CIRCUIT</small></div></div><div class="status" id="topStatus">Digital loyalty card</div></header>
<main id="app"></main><div class="foot">18+ only · Reward terms set by the store <span class="credit"><i>✦</i> CREATED BY HOOLEESHEET</span></div></div><div id="toast" class="toast hidden"></div>
<script>
(() => {
  const app = document.querySelector('#app');
  const cfg = window.VAPERS_CONFIG || {};
  const cardToken = new URLSearchParams(location.search).get('card');
  let db = null, scanner = null, scanResult = null, createdCard = null, ownerMembers = [], editingToken = null, recoveryScreenActive = false;
  const isConfigured = cfg.supabaseUrl && cfg.supabasePublishableKey && !cfg.supabaseUrl.includes('YOUR-PROJECT') && !cfg.supabasePublishableKey.includes('YOUR-PUBLISHABLE');
  if (isConfigured && window.supabase) db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabasePublishableKey);

  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast = msg => { const t=document.querySelector('#toast'); t.textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2300); };
  const errMsg = e => e?.message || 'The request could not be completed. Please try again.';
  const isUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(s||''));
  function cardLink(token){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('card',token);return u.toString();}
  function tokenFromScan(raw){try{const u=new URL(raw);return u.searchParams.get('card')||null}catch{return isUuid(raw)?raw:null}}
  async function rpc(name,args={}){if(!db)throw new Error('The online database is not connected yet.');const {data,error}=await db.rpc(name,args);if(error)throw error;return data}
  function settingsMessage(){app.innerHTML=`<section class="notice"><b>Setup required.</b> Connect the secure database in <code>config.js</code> before creating or viewing live customer cards.</section><div class="eyebrow">VAPERS rewards</div><h1 class="title">Simple loyalty rewards.</h1><p class="sub">Configure the database to enable customer status and owner tools.</p><section class="panel"><h2 style="margin-top:0">Steps to launch</h2><ol class="muted"><li>Create a Supabase project and run <code>schema.sql</code>.</li><li>Register the owner account using the setup guide.</li><li>Copy <code>config.js.example</code> to <code>config.js</code> and add the project URL and public key.</li><li>Host the app over HTTPS to use the camera scanner.</li></ol><p class="hint">Never put the service-role key in the browser. See the README for full setup instructions.</p></section>`;}
  function progressMarkup(status){const n=Math.min(status.stamp_count||0,status.stamps_required||10),target=status.stamps_required||10,ready=!!status.reward_ready;return `<div class="progresshead"><span>Stamp progress</span><span><b>${n}</b> / ${target}</span></div><div class="progress"><i style="width:${Math.min(100,n/target*100)}%"></i></div><div class="stamps">${Array.from({length:target},(_,i)=>`<div class="stamp ${i<n?'done':''}" style="--i:${i}">${i<n?'✓':String(i+1).padStart(2,'0')}</div>`).join('')}</div><div class="reward ${ready?'ready':''}"><div class="rewardIcon">${ready?'★':'↗'}</div><div><b>${ready?'Reward unlocked':`${target} stamps unlock your reward`}</b><small>${ready?esc(status.reward_label):'Show this card to the owner for each qualifying purchase.'}</small></div></div>`;}
function cardRoundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function cardBase(ctx){cardRoundRect(ctx,0,0,1125,675,34);const bg=ctx.createLinearGradient(0,0,1125,675);bg.addColorStop(0,'#07101a');bg.addColorStop(.55,'#10243a');bg.addColorStop(1,'#071622');ctx.fillStyle=bg;ctx.fill();ctx.save();cardRoundRect(ctx,0,0,1125,675,34);ctx.clip();const glow=ctx.createRadialGradient(980,185,15,980,185,360);glow.addColorStop(0,'rgba(34,128,255,.24)');glow.addColorStop(1,'rgba(34,128,255,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,1125,675);ctx.strokeStyle='rgba(126,229,255,.16)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(785,160);ctx.bezierCurveTo(840,110,900,205,960,150);ctx.bezierCurveTo(1015,100,1065,128,1115,88);ctx.stroke();ctx.beginPath();ctx.moveTo(0,540);ctx.bezierCurveTo(30,500,65,560,95,525);ctx.stroke();ctx.restore();ctx.strokeStyle='rgba(99,131,154,.55)';ctx.lineWidth=3;cardRoundRect(ctx,2,2,1121,671,32);ctx.stroke()}
function drawVape(ctx){ctx.save();ctx.translate(128,420);ctx.rotate(-.24);ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=18;ctx.fillStyle='#172c3d';cardRoundRect(ctx,-28,-155,56,190,21);ctx.fill();ctx.strokeStyle='#60dfff';ctx.lineWidth=3;ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='rgba(96,224,255,.35)';cardRoundRect(ctx,-17,-140,34,55,10);ctx.fill();ctx.fillStyle='#65f0df';ctx.beginPath();ctx.arc(0,-75,5,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawCardFront(name,code,stamps,qr){const c=document.createElement('canvas');c.width=1125;c.height=675;const x=c.getContext('2d');cardBase(x);drawVape(x);x.fillStyle='#f7fbff';x.font='900 58px Arial';x.fillText('VAPERS',65,86);x.fillStyle='#98b3c4';x.font='700 16px Arial';x.fillText('LOYALTY MEMBER PASS',68,119);x.fillStyle='#98b3c4';x.font='800 15px Arial';x.fillText('COLLECT 10 STAMPS',272,182);const centers=[300,400,500,600,700],n=Math.min(Number(stamps)||0,10);for(let i=0;i<10;i++){const col=i%5,row=Math.floor(i/5),cx=centers[col],cy=252+row*91;x.beginPath();x.arc(cx,cy,31,0,Math.PI*2);x.fillStyle=i<n?'#72f2d3':'#eef8fc';x.fill();x.strokeStyle='#3daaff';x.lineWidth=4;x.stroke();x.fillStyle='#102336';x.font='900 15px Arial';x.textAlign='center';x.fillText(i<n?'✓':String(i+1).padStart(2,'0'),cx,cy+5)}x.textAlign='left';x.fillStyle='#0d2a40';cardRoundRect(x,252,405,530,125,18);x.fill();x.strokeStyle='#369fe2';x.lineWidth=2;x.stroke();x.fillStyle='#68e5f2';x.font='800 14px Arial';x.fillText('YOUR REWARD',278,440);x.fillStyle='#fff';x.font='900 32px Arial';x.fillText('BUY 10 / GET 1 FREE',278,490);x.fillStyle='#a9bfcc';x.font='700 14px Arial';x.fillText('MEMBER',65,590);x.fillStyle='#f5fbff';x.font='800 21px Arial';x.fillText(String(name||'VAPERS Member').slice(0,27),65,620);x.fillStyle='#8fa8b8';x.font='700 13px Arial';x.fillText(String(code||'').toUpperCase()+'  ·  18+ ONLY  ·  TERMS APPLY',65,648);x.textAlign='right';x.fillStyle='#6ce8ff';x.font='800 12px Arial';x.fillText('✦ CREATED BY HOOLEESHEET',1060,648);x.textAlign='left';x.fillStyle='#fff';cardRoundRect(x,835,188,220,260,16);x.fill();x.drawImage(qr,845,198,200,200);x.fillStyle='#314e60';x.font='800 12px Arial';x.textAlign='center';x.fillText('SHOW AT CHECKOUT',945,425);x.textAlign='left';return c}
function drawCardBack(name,code,qr){const c=document.createElement('canvas');c.width=1125;c.height=675;const x=c.getContext('2d');cardBase(x);x.fillStyle='#f7fbff';x.font='900 36px Arial';x.fillText('HOW YOUR REWARDS WORK',66,86);x.fillStyle='#98b3c4';x.font='700 15px Arial';x.fillText('VAPERS LOYALTY MEMBER PASS',68,120);x.strokeStyle='rgba(72,159,204,.65)';x.lineWidth=2;x.beginPath();x.moveTo(66,148);x.lineTo(1059,148);x.stroke();const steps=[['01','Show your member QR','Open your digital card at checkout.'],['02','Collect 10 stamps','The owner records each qualifying purchase.'],['03','Claim your free reward','After redemption, your progress starts again at 0/10.']];steps.forEach((s,i)=>{const y=220+i*112;x.beginPath();x.arc(92,y-8,24,0,Math.PI*2);x.fillStyle='#12364b';x.fill();x.strokeStyle='#54dff1';x.lineWidth=2;x.stroke();x.fillStyle='#e7fbff';x.font='900 15px Arial';x.textAlign='center';x.fillText(s[0],92,y-3);x.textAlign='left';x.fillStyle='#f2f8fb';x.font='800 21px Arial';x.fillText(s[1],135,y-10);x.fillStyle='#a4b8c5';x.font='15px Arial';x.fillText(s[2],135,y+19)});x.fillStyle='#fff';cardRoundRect(x,800,190,260,300,18);x.fill();x.drawImage(qr,824,212,212,212);x.fillStyle='#314e60';x.font='800 13px Arial';x.textAlign='center';x.fillText('SCAN OR SHOW AT CHECKOUT',930,455);x.fillStyle='#87e5fa';x.font='800 12px Arial';x.fillText(String(code||'').toUpperCase(),930,471);x.textAlign='left';x.fillStyle='#9eb2bf';x.font='700 13px Arial';x.fillText('18+ ONLY  ·  TERMS APPLY',66,592);x.fillStyle='#6ce8ff';x.font='800 12px Arial';x.textAlign='right';x.fillText('✦ CREATED BY HOOLEESHEET',1059,592);x.textAlign='left';x.fillStyle='#7f98a8';x.font='700 12px Arial';x.fillText(String(name||'VAPERS Member').slice(0,38)+'  ·  '+String(code||'').toUpperCase(),66,622);return c}

async function downloadPersonalizedCard(name,code,stamps,qrText){
 let cleanup=()=>{};
 try{
  const result=await makeQrCanvas(qrText);cleanup=result.cleanup;
  let svg=FRONT_CARD_TEMPLATE;
  const xs=[125, 290, 455, 620, 785],stampMarkup=[];
  for(let i=0;i<10;i++){
   const x=xs[i%5],y=250+Math.floor(i/5)*98,done=i<Math.max(0,Math.min(10,Number(stamps)||0));
   stampMarkup.push(`<circle cx="${x}" cy="${y}" r="36" fill="${done?'#6cebd3':'#f0f8fc'}" stroke="${done?'#61ffe4':'url(#blue)'}" stroke-width="4"/><text x="${x}" y="${y+6}" text-anchor="middle" fill="#102336" font-family="Arial,Helvetica,sans-serif" font-size="${done?21:17}" font-weight="900">${done?'✓':String(i+1).padStart(2,'0')}</text>`);
  }
  svg=svg.replace(/<!--STAMP_START-->[\s\S]*?<!--STAMP_END-->/,stampMarkup.join(''));
  const qrData=result.canvas.toDataURL('image/png');
  svg=svg.replace(/<!--QR_START-->[\s\S]*?<!--QR_END-->/,`<g><rect x="867" y="193" width="222" height="222" rx="17" fill="#fff"/><image href="${qrData}" x="890" y="207" width="176" height="176"/><text x="978" y="405" text-anchor="middle" fill="#40586b" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="800" letter-spacing="1">SHOW AT CHECKOUT</text></g>`);
  const escapeXml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
  svg=svg.replace(/(id="member-name"[^>]*>)Your Name/,(_,tag)=>tag+escapeXml(name).slice(0,24));
  svg=svg.replace(/(id="member-code"[^>]*>)VAP-MEMBER/,(_,tag)=>tag+escapeXml(code).slice(0,20));
  const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});
  const canvas=document.createElement('canvas');canvas.width=2250;canvas.height=1350;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);
  const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!png)throw new Error('Could not render the card image.');
  const downloadUrl=URL.createObjectURL(png),a=document.createElement('a');a.href=downloadUrl;a.download=`VAPERS-${String(code).replace(/[^a-z0-9-]/gi,'')}-loyalty-card.png`;a.click();setTimeout(()=>URL.revokeObjectURL(downloadUrl),1000);toast('Downloaded the personalized loyalty card PNG.');
 }catch(e){toast(e.message||'Could not download the loyalty card.');}finally{cleanup();}
}
async function downloadLoyaltyCard(name,code,stamps,token){return downloadPersonalizedCard(name,code,stamps,cardLink(token))}

;}catch(x){msg.textContent=errMsg(x);}finally{b.disabled=false;}};}
  async function renderOwner(){document.querySelector('#topStatus').textContent='Owner dashboard';const {data:{session}}=await db.auth.getSession();if(recoveryScreenActive)return;if(!session){loginScreen();return;}app.innerHTML=`<div class="eyebrow">Owner dashboard</div><h1 class="title">You’re in control.</h1><p class="sub">Create digital cards and record stamps after cash purchases.</p><div class="grid"><section class="panel"><h2 style="margin:0 0 14px">New customer</h2><form id="createForm" class="stack"><input id="newName" class="field" maxlength="60" placeholder="Customer name" required><button class="btn" type="submit">+ Create digital card</button></form><div id="createdCard" class="hidden"></div><hr class="rule"><button class="btn ghost" id="scanToggle">Open QR scanner</button><div id="scannerBox" class="hidden" style="margin-top:13px"><div id="reader" class="scanner"></div><p class="hint">Allow camera access. HTTPS is required.</p></div><div id="scanError" class="error" style="margin-top:8px"></div><div class="rowline" style="margin-top:12px"><input id="manualToken" class="field" placeholder="Or paste card link / token"><button class="btn secondary" id="lookupBtn">Look up</button></div><div id="scanResult" class="hidden"></div></section><section class="panel"><div class="row" style="margin-bottom:13px"><h2 style="margin:0">Customers</h2><button class="btn ghost" id="refreshBtn">Refresh</button></div><div class="member-toolbar"><input id="memberSearch" class="field" placeholder="Search by name or member ID"><div id="memberSummary" class="member-summary"></div></div><div id="memberList" class="list"><span class="hint">Loading customer records…</span></div><p class="hint" style="margin-bottom:0">Every stamp and reward redemption is logged.</p></section></div><dialog id="editDialog" class="edit-dialog"><form id="editForm"><h2>Edit customer</h2><p class="hint">Update the name shown on the digital loyalty card.</p><input id="editName" class="field" maxlength="60" required><div class="actions"><button type="button" class="btn ghost" id="cancelEdit">Cancel</button><button type="submit" class="btn">Save changes</button></div></form></dialog><dialog id="passwordDialog" class="edit-dialog"><form id="ownerPasswordForm"><h2>Change your password</h2><p class="hint">Choose a new password with at least 8 characters.</p><div class="stack"><input id="ownerNewPassword" class="field" type="password" autocomplete="new-password" minlength="8" placeholder="New password" required><input id="ownerConfirmPassword" class="field" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm new password" required><div id="ownerPasswordError" class="error"></div></div><div class="actions"><button type="button" class="btn ghost" id="cancelPassword">Cancel</button><button type="submit" class="btn">Save password</button></div></form></dialog><div class="actions"><button class="btn ghost" id="changePasswordBtn">Change password</button><button class="btn ghost" id="logoutBtn">Sign out</button></div>`;
    document.querySelector('#createForm').onsubmit=createMember;document.querySelector('#scanToggle').onclick=toggleScanner;document.querySelector('#lookupBtn').onclick=lookupManual;document.querySelector('#refreshBtn').onclick=loadMembers;document.querySelector('#memberSearch').oninput=renderMemberList;document.querySelector('#editForm').onsubmit=saveMemberEdit;document.querySelector('#cancelEdit').onclick=()=>document.querySelector('#editDialog').close();document.querySelector('#changePasswordBtn').onclick=()=>document.querySelector('#passwordDialog').showModal();document.querySelector('#cancelPassword').onclick=()=>document.querySelector('#passwordDialog').close();document.querySelector('#ownerPasswordForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,b=form.querySelector('button[type="submit"]'),password=document.querySelector('#ownerNewPassword').value;if(password!==document.querySelector('#ownerConfirmPassword').value){document.querySelector('#ownerPasswordError').textContent='The passwords do not match.';return;}b.disabled=true;document.querySelector('#ownerPasswordError').textContent='';try{const {error}=await db.auth.updateUser({password});if(error)throw error;document.querySelector('#passwordDialog').close();form.reset();toast('Password updated.');}catch(x){document.querySelector('#ownerPasswordError').textContent=errMsg(x);}finally{b.disabled=false;}};document.querySelector('#logoutBtn').onclick=async()=>{await stopScanner();await db.auth.signOut();loginScreen();};await loadMembers();}
  async function createMember(e){e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{const rows=await rpc('owner_create_member',{p_display_name:document.querySelector('#newName').value});const m=Array.isArray(rows)?rows[0]:rows;if(!m?.card_token)throw new Error('Could not create the card.');createdCard={token:m.card_token,code:m.member_code,name:document.querySelector('#newName').value.trim()};document.querySelector('#newName').value='';showCreatedCard();await loadMembers();}catch(x){toast(errMsg(x));}finally{b.disabled=false;}}
  function showCreatedCard(){const el=document.querySelector('#createdCard');const url=cardLink(createdCard.token);el.classList.remove('hidden');el.innerHTML=`${digitalCardMarkup(createdCard.name,createdCard.code,0,'newQr')}<div class="qrurl"><b>${esc(createdCard.name||'New customer')} · ${esc(createdCard.code)}</b><br>${esc(url)}</div><div class="actions"><button class="btn secondary" id="shareNew">Share</button><button class="btn ghost" id="copyNew">Copy link</button><button class="btn" id="downloadNew">Download card PNG</button></div><p class="hint">Share this link with the customer. It opens their read-only status and QR code.</p>`;if(window.QRCode)new QRCode(document.querySelector('#newQr'),{text:url,width:88,height:88,colorDark:'#07131e',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});document.querySelector('#shareNew').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'VAPERS Rewards card',text:'Here is your digital loyalty card.',url});else{await navigator.clipboard.writeText(url);toast('Link copied.')}}catch(x){if(x.name!=='AbortError')toast('Could not share the link.');}};document.querySelector('#copyNew').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('Card link copied.')}catch{toast('Copy the link from the box.')}};document.querySelector('#downloadNew').onclick=()=>downloadLoyaltyCard(createdCard.name||'VAPERS Member',createdCard.code,0,createdCard.token);}
  async function loadMembers(){const box=document.querySelector('#memberList');if(!box)return;box.innerHTML='<span class="hint">Loading customer records…</span>';try{ownerMembers=await rpc('owner_list_members')||[];renderMemberList();}catch(e){box.innerHTML=`<div class="error">${esc(errMsg(e))}</div>`;}}
  function renderMemberList(){const box=document.querySelector('#memberList');if(!box)return;const q=(document.querySelector('#memberSearch')?.value||'').trim().toLowerCase();const filtered=ownerMembers.filter(m=>`${m.display_name||''} ${m.member_code}`.toLowerCase().includes(q));const active=ownerMembers.filter(m=>m.active);const ready=active.filter(m=>m.reward_ready).length;document.querySelector('#memberSummary').textContent=`${active.length} active customers · ${ready} rewards ready`;if(!filtered.length){box.innerHTML='<div class="hint">No matching customer cards.</div>';return;}box.innerHTML=filtered.map(m=>`<div class="item"><div><div class="itemname">${esc(m.display_name||'VAPERS Member')}</div><div class="mini">${esc(m.member_code)} · ${m.active?`${m.stamp_count}/${m.stamps_required} stamps${m.reward_ready?' · reward ready':''}`:'deleted'}</div></div><div class="row-actions"><button class="btn secondary" onclick="showOwnerCard('${m.card_token}')" ${m.active?'':'disabled'}>Open</button><button class="btn ghost" onclick="editMember('${m.card_token}')" ${m.active?'':'disabled'}>Edit</button><button class="btn ghost" onclick="deactivateCard('${m.card_token}')" ${m.active?'':'disabled'}>Delete</button></div></div>`).join('');}
  window.editMember=token=>{const m=ownerMembers.find(x=>x.card_token===token);if(!m||!m.active)return;editingToken=token;document.querySelector('#editName').value=m.display_name||'';document.querySelector('#editDialog').showModal();document.querySelector('#editName').focus();};
  async function saveMemberEdit(e){e.preventDefault();const name=document.querySelector('#editName').value.trim();if(!name)return;const b=e.currentTarget.querySelector('button[type="submit"]');b.disabled=true;try{await rpc('owner_update_member',{p_card_token:editingToken,p_display_name:name});document.querySelector('#editDialog').close();toast('Customer name updated.');await loadMembers();if(scanResult===editingToken)await showOwnerCard(editingToken);}catch(x){toast(errMsg(x));}finally{b.disabled=false;}}

  async function statusFor(token){const rows=await rpc('get_card_status',{p_card_token:token});return Array.isArray(rows)?rows[0]:rows;}
  window.showOwnerCard=async token=>{scanResult=token;const box=document.querySelector('#scanResult');box.classList.remove('hidden');box.innerHTML='<section class="panel">Loading card status…</section>';try{const s=await statusFor(token);if(!s){box.innerHTML='<div class="error">Card not found or inactive.</div>';return;}const ready=s.reward_ready;box.innerHTML=`<section class="panel"><div class="row"><div><div class="eyebrow">Customer card</div><div class="member">${esc(s.display_name||'VAPERS Member')}</div><div class="membercode">${esc(s.member_code)}</div></div><span class="pill ${ready?'ready':''}">${ready?'REWARD READY':'ACTIVE'}</span></div>${progressMarkup(s)}<div class="actions" style="margin-top:16px"><button class="btn" onclick="addStampNow('${token}')" ${ready?'disabled':''}>Add 1 stamp</button><button class="btn secondary" onclick="redeemNow('${token}')" ${ready?'':'disabled'}>Redeem reward</button></div><p class="hint">Confirm that the qualifying purchase is paid before adding a stamp.</p></section>`;}catch(e){box.innerHTML=`<div class="error">${esc(errMsg(e))}</div>`;}};
  window.addStampNow=async token=>{try{await rpc('owner_add_stamp',{p_card_token:token});toast('Stamp added.');await showOwnerCard(token);await loadMembers();}catch(e){toast(errMsg(e));}};
  window.redeemNow=async token=>{if(!confirm('Has the reward been redeemed?'))return;try{await rpc('owner_redeem_reward',{p_card_token:token});toast('Reward redeemed.');await showOwnerCard(token);await loadMembers();}catch(e){toast(errMsg(e));}};
  window.deactivateCard=async token=>{if(!confirm('Deactivate this card? The old QR will stop working.'))return;try{await rpc('owner_deactivate_card',{p_card_token:token});toast('Customer card deleted.');await loadMembers();}catch(e){toast(errMsg(e));}};
  async function toggleScanner(){const box=document.querySelector('#scannerBox');if(!box.classList.contains('hidden')){await stopScanner();box.classList.add('hidden');return;}if(!window.Html5Qrcode){document.querySelector('#scanError').textContent='The QR scanner library did not load.';return;}box.classList.remove('hidden');document.querySelector('#scanError').textContent='';scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},async text=>{const token=tokenFromScan(text);if(!token){document.querySelector('#scanError').textContent='This is not a VAPERS loyalty QR.';return;}await stopScanner();box.classList.add('hidden');document.querySelector('#manualToken').value=token;await showOwnerCard(token);},()=>{});}catch(e){document.querySelector('#scanError').textContent='Could not open the camera. Allow access or paste the card link/token.';}}
  async function stopScanner(){if(scanner){try{if(scanner.isScanning)await scanner.stop();}catch{}try{scanner.clear();}catch{}scanner=null;}}
  async function lookupManual(){const raw=document.querySelector('#manualToken').value.trim();const token=tokenFromScan(raw)|| (isUuid(raw)?raw:null);if(!token){document.querySelector('#scanError').textContent='Paste the customer card link or token.';return;}document.querySelector('#scanError').textContent='';await showOwnerCard(token);}
  if(db)db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'&&!cardToken)setPasswordScreen();});
  async function boot(){if(!db){settingsMessage();return;}if(cardToken){await renderCustomer();return;}const authParams=new URLSearchParams(`${location.search.slice(1)}&${location.hash.slice(1)}`);if(authParams.get('type')==='recovery'){setPasswordScreen();return;}await renderOwner();}
  boot();
})();
</script></body></html>

<svg xmlns="http://www.w3.org/2000/svg" width="3.75in" height="2.25in" viewBox="0 0 1125 675" role="img" aria-labelledby="title desc">
<title id="title">VAPERS digital loyalty card — front</title><desc id="desc">Premium loyalty card with blue vapor, ten stamp spaces, a unique QR code area and buy ten get one free reward.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101a"/><stop offset=".52" stop-color="#101d2a"/><stop offset="1" stop-color="#071622"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56efff"/><stop offset=".48" stop-color="#2687ff"/><stop offset="1" stop-color="#664eff"/></linearGradient>

 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".6"/></filter>
 <clipPath id="clip"><rect width="1125" height="675" rx="34"/></clipPath>
</defs>
